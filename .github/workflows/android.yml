
name: Build AR16 OS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir project
          unzip AR16_OS_Android_Source_With_Cloud_Build.zip -d project
          find project -type f \( -name settings.gradle -o -name settings.gradle.kts \)

            - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          SETTINGS_DIR="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          if [ -z "$SETTINGS_DIR" ]; then
            echo "File settings.gradle tidak ditemukan"
            exit 1
          fi
          cd "$SETTINGS_DIR"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AR16-OS-debug-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
