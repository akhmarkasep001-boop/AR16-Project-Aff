
name: Build AR16 OS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p project
          unzip -o AR16_OS_Android_Source_With_Cloud_Build.zip -d project
          SETTINGS_DIR="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          if [ -z "$SETTINGS_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan dalam ZIP"
            find project -maxdepth 5 -type f | head -n 80
            exit 1
          fi
          echo "PROJECT_DIR=$SETTINGS_DIR" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AR16-OS-debug-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
